<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Hospitalar Cataratas - Dados em Tempo Real</title>
    <style>
        /* Cores Hospitalares e Configuração de Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('background.png'); 
            background-size: cover;          
            background-position: center;    
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            background-color: #4c7eaf;      
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .moldura-hospitalar {
            background-color: rgba(255, 255, 255, 0.92);
            border: 3px solid #005a9c;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 90, 156, 0.25);
            width: 100%;
            max-width: 1350px;
            padding: 25px;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
            margin-bottom: 20px;
        }

        .cabecalho-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cabecalho-painel h2 {
            margin: 0;
            color: #003366;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-atualizacao {
            font-size: 12px;
            color: #557a95;
            margin-top: 5px;
        }

        .acoes-cabecalho {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-busca {
            padding: 8px 12px;
            border: 1px solid #d0dde5;
            border-radius: 6px;
            font-size: 13px;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-busca:focus {
            border-color: #005a9c;
        }

        .botao-atualizar {
            background-color: #005a9c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .botao-atualizar:hover {
            background-color: #003366;
        }

        /* Layout em Duas Colunas (Tabela + Gráfico) */
        .conteudo-principal {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .coluna-tabela {
            flex: 2;
            min-width: 550px;
        }

        .coluna-grafico {
            flex: 1;
            min-width: 320px;
            background: #f9fbfd;
            border: 1px solid #d0dde5;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            max-height: 550px;
            overflow-y: auto;
        }

        .coluna-grafico h3 {
            margin-top: 0;
            color: #003366;
            font-size: 15px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        /* Estilo das Barras do Gráfico */
        .barra-item {
            margin-bottom: 10px;
        }

        .barra-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .barra-container-fundo {
            background-color: #e2e8f0;
            border-radius: 4px;
            height: 14px;
            width: 100%;
            overflow: hidden;
        }

        .barra-preenchimento {
            background-color: #005a9c;
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .tabela-container {
            overflow-x: auto;
            max-height: 550px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #d0dde5;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
        }

        th {
            background-color: #005a9c;
            color: #ffffff;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        tr:nth-child(even) {
            background-color: rgba(247, 250, 252, 0.6);
        }

        tr:hover {
            background-color: rgba(238, 244, 249, 0.8);
        }

        .rodape-painel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #e1e8ed;
            margin-top: 20px;
            padding-top: 10px;
        }

        .rodape-texto {
            font-size: 12px;
            color: #557a95;
        }

        .logo-rodape {
            max-height: 35px;
            width: auto;
        }

        details summary {
            cursor: pointer;
            color: #005a9c;
            font-weight: 600;
            user-select: none;
        }

        details summary:hover {
            color: #003366;
            text-decoration: underline;
        }

        .detalhe-conteudo {
            margin-top: 6px;
            padding: 8px;
            background: #f9fbfd;
            border: 1px solid #d0dde5;
            border-radius: 6px;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="moldura-hospitalar">
        <div class="cabecalho-painel">
            <div>
                <h2>Painel Cataratas - total</h2>
                <div class="status-atualizacao">Atualizando automaticamente a cada 2 minutos</div>
            </div>
            <div class="acoes-cabecalho">
                <input type="text" id="filtroCidade" class="input-busca" placeholder="Filtrar cidade..." onkeyup="filtrarTabela()">
                <button class="botao-atualizar" id="btnAtualizar" onclick="carregarPainelCruzado()">Atualizar Agora</button>
            </div>
        </div>
        
        <!-- Estrutura dividida em duas colunas -->
        <div class="conteudo-principal">
            <div class="coluna-tabela">
                <div id="tabela1" class="tabela-container">Carregando dados consolidados...</div>
            </div>
            
            <div class="coluna-grafico">
                <h3>Volume por Cidade</h3>
                <div id="graficoBarras">Carregando gráfico...</div>
            </div>
        </div>

        <div class="rodape-painel">
            <div class="rodape-texto">Sistema Integrado de Gestão</div>
            <div>
                <img src="background.png" alt="Logo Instituição" class="logo-rodape">
            </div>
        </div>
    </div>

    <script>
        const urlCSV1 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAQ4Vy7_JLWeqXShPyi5SNeyjOLslqKPtfNTZVrnEmfTqd6Vchi6s-DtxSplDmwKLiPEvzN94Z53W8/pub?gid=763842179&single=true&output=csv';
        const urlCSV2 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAQ4Vy7_JLWeqXShPyi5SNeyjOLslqKPtfNTZVrnEmfTqd6Vchi6s-DtxSplDmwKLiPEvzN94Z53W8/pub?gid=836228025&single=true&output=csv';

        let dadosGlobaisTabela = [];
        let cabecalhoTabela = [];
        let dadosGraficoCache = [];

        function carregarPainelCruzado() {
            if (!urlCSV1 || urlCSV1.includes('COLOQUE_O_LINK')) {
                document.getElementById('tabela1').innerHTML = '<p style="color: #d9534f; font-weight: bold;">Configure o link da Aba 1.</p>';
                return;
            }

            const btn = document.getElementById('btnAtualizar');
            btn.disabled = true;
            btn.textContent = 'Atualizando...';

            const linkCache1 = urlCSV1 + (urlCSV1.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            const linkCache2 = urlCSV2 + (urlCSV2.includes('?') ? '&' : '?') + 't=' + new Date().getTime();

            Promise.all([
                fetch(linkCache1).then(res => {
                    if (!res.ok) throw new Error('Erro na rede');
                    return res.text();
                }),
                fetch(linkCache2).then(res => res.text()).catch(() => "")
            ])
            .then(([data1, data2]) => {
                if (!data1 || data1.trim() === "") throw new Error('Dados vazios.');

                const divisor1 = data1.includes(';') ? ';' : ',';
                const divisor2 = data2.includes(';') ? ';' : ',';
                
                const linhas1 = data1.split('\n');
                const linhas2 = data2.split('\n');
                
                dadosGlobaisTabela = [];
                dadosGraficoCache = [];
                
                linhas1.forEach((linha, i) => {
                    if (!linha.trim()) return;
                    const colunas1 = linha.split(divisor1).map(c => c.replace(/^"|"$/g, '').trim());

                    if (i === 0) {
                        cabecalhoTabela = colunas1;
                        return;
                    }

                    const nomeCidade = colunas1[0];
                    if (!nomeCidade) return;

                    const primeiraColunaTexto = nomeCidade.toLowerCase();
                    const ehTotalizador = primeiraColunaTexto.includes('total') || primeiraColunaTexto.includes('geral');

                    // Tenta identificar qual coluna numérica usar para o gráfico (pega a última coluna numérica da linha)
                    let valorNumerico = 0;
                    if (!ehTotalizador) {
                        for (let c = colunas1.length - 1; c >= 1; c--) {
                            let num = parseFloat(colunas1[c].replace(',', '.'));
                            if (!isNaN(num)) {
                                valorNumerico = num;
                                break;
                            }
                        }
                        if (valorNumerico > 0) {
                            dadosGraficoCache.push({ cidade: nomeCidade, valor: valorNumerico });
                        }
                    }

                    let secretariasEncontradas = [];
                    let secretariaAtual = "";

                    if (!ehTotalizador) {
                        linhas2.forEach((l2) => {
                            if (!l2.trim()) return;
                            const cols2 = l2.split(divisor2).map(c => c.replace(/^"|"$/g, '').trim());
                            
                            if (cols2[0] && cols2[0] !== "" && (cols2.length === 1 || cols2[1] === "" || isNaN(cols2[1]))) {
                                secretariaAtual = cols2[0];
                            }

                            const linhaCompletaTexto = cols2.join(' ').toLowerCase();
                            const ehTotalAba2 = linhaCompletaTexto.includes('total') || linhaCompletaTexto.includes('geral');

                            if (linhaCompletaTexto.includes(nomeCidade.toLowerCase()) && !ehTotalAba2) {
                                let infoValor = cols2.filter(Boolean).join(' - ');
                                let textoFinalItem = secretariaAtual && !infoValor.toLowerCase().includes(secretariaAtual.toLowerCase()) 
                                    ? `${secretariaAtual}: ${infoValor}` 
                                    : infoValor;

                                if (!secretariasEncontradas.includes(textoFinalItem)) {
                                    secretariasEncontradas.push(textoFinalItem);
                                }
                            }
                        });
                    }

                    dadosGlobaisTabela.push({
                        cidade: nomeCidade,
                        colunas: colunas1,
                        eTotal: ehTotalizador,
                        secretarias: secretariasEncontradas
                    });
                });

                renderizarInterface();
            })
            .catch(err => {
                console.error("Erro ao atualizar:", err);
                if(document.getElementById('tabela1').innerHTML.includes('Carregando')) {
                    document.getElementById('tabela1').innerHTML = '<p style="color: #d9534f;">Erro ao carregar dados.</p>';
                }
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Atualizar Agora';
            });
        }

        function renderizarInterface(filtroTexto = "") {
            // Monta Tabela
            let htmlTabela = '<table id="tabelaDados"><tr>';
            cabecalhoTabela.forEach(h => htmlTabela += `<th>${h || "-"}</th>`);
            htmlTabela += '<th>Secretarias Encaminhadoras</th></tr>';

            let dadosFiltradosGrafico = [];

            dadosGlobaisTabela.forEach(item => {
                const matchFiltro = item.cidade.toLowerCase().includes(filtroTexto);
                if (!matchFiltro && !item.eTotal) return;

                // Se passou no filtro, adiciona ao gráfico (exceto totais)
                if (!item.eTotal) {
                    let valNum = 0;
                    for (let c = item.colunas.length - 1; c >= 1; c--) {
                        let num = parseFloat(item.colunas[c].replace(',', '.'));
                        if (!isNaN(num)) { valNum = num; break; }
                    }
                    dadosFiltradosGrafico.push({ cidade: item.cidade, valor: valNum });
                }

                htmlTabela += '<tr>';
                item.colunas.forEach(col => htmlTabela += `<td>${col || "-"}</td>`);

                if (item.eTotal) {
                    htmlTabela += '<td>-</td>';
                } else {
                    let conteudoDetalhes = item.secretarias.length > 0 
                        ? "<ul style='margin: 0; padding-left: 15px;'>" + item.secretarias.map(s => `<li>${s}</li>`).join('') + "</ul>"
                        : "<span style='color: #777;'>Nenhum registro.</span>";

                    htmlTabela += `<td><details><summary>Ver Detalhes</summary><div class="detalhe-conteudo">${conteudoDetalhes}</div></details></td>`;
                }
                htmlTabela += '</tr>';
            });

            htmlTabela += '</table>';
            document.getElementById('tabela1').innerHTML = htmlTabela;

            // Monta Gráfico de Barras com base nos dados filtrados
            renderizarGrafico(dadosFiltradosGrafico);
        }

        function renderizarGrafico(dados) {
            const containerGrafico = document.getElementById('graficoBarras');
            if (!dados || dados.length === 0) {
                containerGrafico.innerHTML = '<span style="font-size:12px; color:#777;">Nenhum dado para exibir.</span>';
                return;
            }

            // Ordena decrescente por quantidade
            dados.sort((a, b) => b.valor - a.valor);
            const maiorValor = Math.max(...dados.map(d => d.valor), 1);

            let htmlGrafico = '';
            dados.forEach(d => {
                const porcentagem = Math.round((d.valor / maiorValor) * 100);
                htmlGrafico += `
                    <div class="barra-item">
                        <div class="barra-info">
                            <span>${d.cidade}</span>
                            <span><strong>${d.valor}</strong></span>
                        </div>
                        <div class="barra-container-fundo">
                            <div class="barra-preenchimento" style="width: ${porcentagem}%;"></div>
                        </div>
                    </div>
                `;
            });
            containerGrafico.innerHTML = htmlGrafico;
        }

        function filtrarTabela() {
            const filtro = document.getElementById('filtroCidade').value.toLowerCase();
            renderizarInterface(filtro);
        }

        carregarPainelCruzado();
        setInterval(carregarPainelCruzado, 120000);
    </script>

</body>
</html>
